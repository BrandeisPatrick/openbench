[project]
name = "openbench"
version = "0.1.0"
description = "Long-horizon PR replay benchmark for coding agents, with reasoning-trace reward-fingerprint analysis"
readme = "README.md"
authors = [
    { name = "Bat", email = "59629055+BrandeisPatrick@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "typer>=0.26.7",
    "unidiff>=0.7.5",
]

[project.scripts]
openbench = "openbench.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
    "vulture>=2.16",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
# B008: typer.Option(...)/Argument(...) in defaults is the required idiom.
# E501: long lines tolerated in dense signature tables / prompts.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
